server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets can be cached forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Production equivalents of the Vite dev-server proxies in vite.config.ts
    location /osrm/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $osrm https://router.project-osrm.org;
        rewrite ^/osrm/(.*)$ /$1 break;
        proxy_pass $osrm;
        proxy_ssl_server_name on;
        proxy_set_header Host router.project-osrm.org;
    }

    location /google-places/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $gmaps https://maps.googleapis.com;
        rewrite ^/google-places/(.*)$ /$1 break;
        proxy_pass $gmaps;
        proxy_ssl_server_name on;
        proxy_set_header Host maps.googleapis.com;
        proxy_set_header Origin https://triple.nexdevo.com;
        proxy_set_header Referer https://triple.nexdevo.com/;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

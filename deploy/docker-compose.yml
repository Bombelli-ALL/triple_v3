services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: triple-backend:latest
    restart: unless-stopped
    env_file: backend.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: https://triple.nexdevo.com
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from the server itself; the Cloudflare Tunnel forwards apitriple.nexdevo.com here
    ports:
      - "127.0.0.1:3010:3000"

  frontend:
    image: triple-frontend:latest
    restart: unless-stopped
    # Cloudflare Tunnel forwards triple.nexdevo.com here
    ports:
      - "127.0.0.1:8090:80"

volumes:
  pgdata:
